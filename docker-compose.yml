services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops_desk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - db
    env_file:
      - backend/app/.env
    environment:
      DATABASE_URL: postgresql://aiops:aiops@db:5432/aiops_desk
    ports:
      - "8000:8000"

volumes:
  pgdata: